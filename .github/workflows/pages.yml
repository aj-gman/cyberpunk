name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE_URL: https://aj-gman.github.io
          SITE_PATH_PREFIX: /cyberpunk/
          THEME: ${{ vars.THEME }}
      - name: Verify built Pages site
        run: node scripts/verify-pages-build.js
        env:
          SITE_PATH_PREFIX: /cyberpunk/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed Pages site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          url="${PAGE_URL}?deployment=${GITHUB_SHA}"
          for attempt in $(seq 1 12); do
            html="$(curl --fail --silent --show-error "$url")" || html=""
            if printf '%s' "$html" | grep -Fq 'cm-s-obsidian'; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "The deployed URL is not serving the generated Digital Garden. Check Settings > Pages and select GitHub Actions as the publishing source."
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error "${PAGE_URL}styles/digital-garden-base.css" -o /dev/null