<!doctype html>
<html><head><base target="_top"><meta charset="utf-8"><title>ASG private setup</title>
<style>body{font:16px system-ui;max-width:40rem;margin:3rem auto;padding:1rem;line-height:1.5}button{font:inherit;padding:.6rem 1rem}#status{white-space:pre-wrap}</style>
</head><body><h1>ASG private workbook selection</h1>
<p>Owner-only setup. Select the existing ASG workbook, not another file. This grants this app access to that workbook. No password or signing key is shown here.</p>
<button id="pick" disabled>Select ASG workbook</button><p id="status">Loading Google Picker...</p>
<script>
'use strict';
var config, ready = false;
var statusEl = document.getElementById('status');
function showError() { statusEl.textContent = 'Setup could not continue. Check the owner account, project settings and private /dev setup URL. No token is logged.'; }
function enable() { document.getElementById('pick').disabled = !(ready && config); if (ready && config) statusEl.textContent = 'Ready. Select only the ASG workbook.'; }
function pickerLoaded() { gapi.load('picker', {callback: function () { ready = true; enable(); }}); }
google.script.run.withSuccessHandler(function (value) { config = value; enable(); }).withFailureHandler(showError).getAsgSetupConfig();
document.getElementById('pick').onclick = function () {
  try {
    new google.picker.PickerBuilder()
      .addView(new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS))
      .setOAuthToken(config.token).setDeveloperKey(config.developerKey).setAppId(config.projectNumber)
      .setOrigin(google.script.host.origin)
      .setCallback(function (data) {
        if (data.action !== google.picker.Action.PICKED) return;
        document.getElementById('pick').disabled = true;
        google.script.run.withSuccessHandler(function (message) {
          config = null; statusEl.textContent = message;
        }).withFailureHandler(function () { showError(); enable(); }).selectAsgWorkbook(data.docs[0].id);
      }).build().setVisible(true);
  } catch (_) { showError(); }
};
</script><script src="https://apis.google.com/js/api.js?onload=pickerLoaded" async defer></script>
</body></html>
